<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop & Neon 3D Claw Machine</title>
  <script>
    // デバッグ用のグローバルエラーキャッチャー
    window.addEventListener('error', function(e) {
      const errDiv = document.createElement('div');
      errDiv.style.position = 'fixed';
      errDiv.style.bottom = '10px';
      errDiv.style.left = '10px';
      errDiv.style.right = '10px';
      errDiv.style.background = 'rgba(255, 0, 0, 0.95)';
      errDiv.style.color = '#fff';
      errDiv.style.padding = '15px';
      errDiv.style.zIndex = '99999';
      errDiv.style.fontFamily = 'monospace';
      errDiv.style.fontSize = '12px';
      errDiv.style.borderRadius = '8px';
      errDiv.style.whiteSpace = 'pre-wrap';
      errDiv.innerHTML = '<strong>[JS Error]</strong> ' + e.message + '<br>File: ' + e.filename + '<br>Line: ' + e.lineno + ':' + e.colno;
      document.body.appendChild(errDiv);
    });
    window.addEventListener('unhandledrejection', function(e) {
      const errDiv = document.createElement('div');
      errDiv.style.position = 'fixed';
      errDiv.style.bottom = '10px';
      errDiv.style.left = '10px';
      errDiv.style.right = '10px';
      errDiv.style.background = 'rgba(255, 100, 0, 0.95)';
      errDiv.style.color = '#fff';
      errDiv.style.padding = '15px';
      errDiv.style.zIndex = '99999';
      errDiv.style.fontFamily = 'monospace';
      errDiv.style.fontSize = '12px';
      errDiv.style.borderRadius = '8px';
      errDiv.style.whiteSpace = 'pre-wrap';
      errDiv.innerHTML = '<strong>[Promise Rejection]</strong> ' + e.reason;
      document.body.appendChild(errDiv);
    });
  </script>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Dela+Gothic+One&display=swap" rel="stylesheet">
  
  <!-- Three.js (Global) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls (Global) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Cannon (Global Physics Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <div id="app-container">
    <!-- ヘッダー（タイトル・スコア） -->
    <header class="game-header">
      <h1 class="game-title">CLAW CRUSH!</h1>
      <div class="stats-panel">
        <div class="stat-box" id="score-box">
          <span class="stat-label">SCORE</span>
          <span class="stat-value" id="score-value">0000</span>
        </div>
        <div class="stat-box" id="coin-box">
          <span class="stat-label">COINS</span>
          <span class="stat-value" id="coin-value">0</span>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ領域（3D画面とUIのオーバーレイ） -->
    <main class="game-main">
      <div id="canvas-container">
        <!-- Three.jsのCanvasがここに挿入されます -->
        
        <!-- ゲーム内の案内メッセージ -->
        <div id="game-message" class="pulse">INSERT COIN TO START</div>
      </div>

      <!-- 操作用コントロールパネル -->
      <section class="control-panel">
        <div class="panel-glass">
          <div class="panel-screen">
            <div class="screen-row">
              <span>STATUS:</span>
              <span id="status-text" class="status-ready">READY</span>
            </div>
            <div class="screen-row">
              <span>TIME:</span>
              <span id="timer-text">--</span>
            </div>
          </div>
          
          <div class="controls-layout">
            <button id="insert-coin-btn" class="btn btn-yellow">
              <span class="btn-inner">COIN (¥100)</span>
            </button>
            
            <div class="joystick-area">
              <!-- ボタン1: 右移動 -->
              <button id="btn-right" class="btn btn-pink" disabled>
                <span class="btn-inner">▶ RIGHT (1)</span>
              </button>
              
              <!-- ボタン2: 奥移動 -->
              <button id="btn-forward" class="btn btn-blue" disabled>
                <span class="btn-inner">▲ FORWARD (2)</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- 獲得した景品コレクション -->
      <section class="collection-panel">
        <h3>MY PRIZES</h3>
        <div id="prize-list" class="prize-list">
          <!-- 獲得した景品が動的に追加されます -->
          <div class="no-prizes">No prizes yet!</div>
        </div>
      </section>
    </main>

    <!-- フッター（操作説明） -->
    <footer class="game-footer">
      <p>操作方法: コインを入れてから「RIGHT (1)」ボタンを長押しして右移動 ➔ 「FORWARD (2)」ボタンを長押しして奥移動</p>
    </footer>
  </div>

  <!-- メインJavaScriptの読み込み -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
